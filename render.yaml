services:
  # --- Backend Web Service ---
  - type: web
    name: attrisense-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./attrisense.db

  # --- Frontend Static Site ---
  - type: static
    name: attrisense-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: attrisense-backend
          property: url
          postfix: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
