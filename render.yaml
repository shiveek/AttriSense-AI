services:
  # --- Backend FastAPI Web Service ---
  - type: web
    name: attrisense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://attrisense-ai.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        value: sqlite:///./attrisense.db

  # --- Frontend Static Site (Vercel primary, Render static fallback) ---
  - type: static
    name: attrisense-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: attrisense-backend
          property: url
          postfix: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
